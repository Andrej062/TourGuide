<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Tour Cart</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .cart-page {
      max-width: 700px;
      margin: 6rem auto;
      background: rgba(113, 201, 249, 0.15);
      border-radius: 25px;
      padding: 2.5rem 2rem;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      margin-bottom: 1.5rem;
      color: #367af0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin: 12px 0;
      padding: 15px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      transition: 0.2s ease;
    }

    li:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    #action-btns {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      gap: 1rem;
    }

    #action-btns button {
      flex: 1;
    }

    #confirm-btn {
      background-color: #367af0;
    }

    #confirm-btn:hover {
      background-color: rgba(54, 122, 240, 1);
    }
  </style>
</head>

<body>
  <div class="cart-page">
    <h1>Your Selected Tours</h1>
    <ul id="cart-list"></ul>

<div style="margin-top: 1.5rem; display:flex; gap: 10px; justify-content:center; flex-wrap:wrap;">
  <input id="customer-name" placeholder="First Name" required style="padding:10px;border-radius:12px;border:1px solid #ddd;min-width:150px;">
  <input id="customer-surname" placeholder="Last Name" required style="padding:10px;border-radius:12px;border:1px solid #ddd;min-width:150px;">
  <input id="customer-phone" type="tel" placeholder="Phone Number" required style="padding:10px;border-radius:12px;border:1px solid #ddd;min-width:200px;">
  <input id="customer-email" type="email" placeholder="Email for receipt" required style="padding:10px;border-radius:12px;border:1px solid #ddd;min-width:260px;">
</div>

    <div id="action-btns">
      <button id="back-btn" class="button">⬅ Back</button>
      <button id="confirm-btn" class="button">Confirm</button>
    </div>
  </div>

<script src="i18n.js"></script>
<script src="script.js"></script>

</body>
</html>
